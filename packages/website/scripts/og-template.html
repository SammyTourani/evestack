<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; background: #000; overflow: hidden;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: #ededed; position: relative;
  }
  .grid {
    position: absolute; inset: 48px; border: 1px solid rgba(255,255,255,0.14);
  }
  .grid::before, .grid::after {
    content: ""; position: absolute; background: rgba(255,255,255,0.09);
  }
  .grid::before { left: 50%; top: 0; bottom: 0; width: 1px; }
  .grid::after { top: 55%; left: 0; right: 0; height: 1px; }
  .cross { position: absolute; width: 13px; height: 13px; }
  .cross::before, .cross::after { content: ""; position: absolute; background: #454545; }
  .cross::before { left: 6px; top: 0; width: 1px; height: 13px; }
  .cross::after { top: 6px; left: 0; height: 1px; width: 13px; }
  .glow {
    position: absolute; left: 50%; top: 40%; width: 900px; height: 500px;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse 450px 260px at center,
      rgba(0,124,240,0.35), rgba(0,223,216,0.12) 45%, transparent 70%);
  }
  .content { position: absolute; inset: 48px; padding: 72px 80px; }
  .mark { display: flex; gap: 7px; flex-direction: column; width: 74px; }
  .row { display: flex; gap: 7px; }
  .q { width: 33px; height: 33px; border-radius: 7px; }
  .on { background: linear-gradient(135deg, #2a2d33, #0a0b0d); border: 1px solid rgba(255,255,255,0.28); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35); }
  .off { background: #08090b; border: 1px solid rgba(255,255,255,0.10); }
  h1 { font-size: 92px; font-weight: 500; letter-spacing: -5px; margin-top: 44px; }
  p.tag { font-size: 38px; color: #a0a0a0; margin-top: 18px; letter-spacing: -0.6px; }
  .pill {
    position: absolute; bottom: 72px; left: 80px; display: inline-flex; align-items: center;
    gap: 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 999px;
    padding: 18px 30px; font-family: "SF Mono", Menlo, monospace; font-size: 26px;
  }
  .pill .d { color: #878787; }
  .badge {
    position: absolute; bottom: 84px; right: 80px; font-family: "SF Mono", Menlo, monospace;
    font-size: 20px; color: #878787; letter-spacing: 2px; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="cross" style="left: 594px; top: 361px;"></div>
  <div class="content">
    <div class="mark">
      <div class="row"><div class="q on"></div><div class="q off"></div></div>
      <div class="row"><div class="q off"></div><div class="q on"></div></div>
    </div>
    <h1>evestack</h1>
    <p class="tag">Run eve agents on infrastructure you own.</p>
    <span class="pill"><span class="d">$</span> npx create-evestack</span>
    <span class="badge">Open source · Apache-2.0</span>
  </div>
</body>
</html>
