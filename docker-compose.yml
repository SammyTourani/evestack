# evestack — the whole stack, on your own machine, for $0.
#
#   docker compose up -d                         # Postgres only
#   docker compose --profile dashboard up -d     # Postgres + the dashboard on :4000
#
# THIS FILE IS THE CONTRIBUTOR'S. It BUILDS the dashboard from the checkout you
# are standing in, which is what you want when you are changing it. A scaffolded
# project's docker-compose.yml — the one `evestack create` writes — pulls the
# published image instead and never needs this repository at all.
#
# Nothing here phones home. No Vercel account, no metered compute, no gateway.
#
# The dashboard REFUSES EVERY REQUEST without a credential — it starts agent
# runs, approves gated shell commands and deletes memories, so it fails closed
# by design (packages/dashboard/lib/auth.ts). Give it one before the first
# `--profile full` run. A `.env` beside this file is where compose looks:
#
#   printf 'EVESTACK_AUTH_USER=evestack\nEVESTACK_AUTH_PASSWORD=%s\n' \
#     "$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9')" >> .env
#
# Use the SAME pair your agent has in its .env.local. It is one secret per
# deployment: the dashboard signs you in with it and presents it to the agent.
# Without it the container comes up, answers 503 to everything, and reports
# unhealthy in `docker ps` — which is the intended, visible failure, not a bug.
name: evestack

services:
  # Durable session storage. pgvector image (not plain postgres) because the
  # same database also backs agent memory — one container, two jobs.
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evestack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evestack}
      POSTGRES_DB: ${POSTGRES_DB:-evestack}
    ports:
      # 5433 so we never collide with a local Postgres on 5432, and 127.0.0.1
      # because this database holds every prompt, tool result and memory the
      # agent has produced.
      #
      # This published "${POSTGRES_PORT:-5433}:5432" with no interface prefix,
      # which binds 0.0.0.0 — verified from another machine on the same network,
      # which connected on the LAN address and authenticated with the defaults
      # below. The dashboard forty lines down was already pinned to loopback with
      # a comment about control planes; Postgres is the more valuable target of
      # the two and was the one left open.
      #
      # Contributors who need it reachable can override POSTGRES_BIND, which
      # makes exposure a deliberate act rather than the default.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - evestack-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evestack} -d ${POSTGRES_DB:-evestack}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # The dashboard reads the same Postgres the agent writes to — no ingest
  # pipeline, no second source of truth. Bound to localhost by default: it is a
  # control plane that can start and cancel agent runs, so the published port
  # stays on the loopback interface even though the process inside the container
  # binds 0.0.0.0 (it has to; nothing could reach it otherwise).
  dashboard:
    # `image` AND `build`, deliberately. Compose builds when the tag is not
    # already present locally and tags the result with this name — so a
    # contributor's build lands under exactly the name the published image uses,
    # `docker compose push` works without a second tagging step, and a scaffolded
    # project on the same machine finds the local build without being told to.
    #
    # The tag tracks packages/dashboard/package.json `version`; the publish
    # workflow refuses to release when they disagree.
    #
    # That sentence was false for this file until the gate learned to scan.
    # publish-dashboard.yml compared the version against the git tag and against
    # DASHBOARD_IMAGE_TAG in create-evestack/shared.mjs, and read nothing else —
    # so a release could ship 0.2.0 while this line, and docs/self-hosting.mdx,
    # went on telling readers to pull 0.1.0. It now `git grep`s every written-out
    # `evestack-dashboard:<version>` in the tree and requires them all to agree,
    # which is why the claim above is safe to make.
    image: ${EVESTACK_DASHBOARD_IMAGE:-ghcr.io/sammytourani/evestack-dashboard:0.1.0}
    build:
      # The REPOSITORY ROOT, not packages/dashboard. The dashboard depends on
      # @evestack/schedules over pnpm's `workspace:*` protocol, which only
      # resolves against the root lockfile — building from the package directory
      # is what made `npm install` die on EUNSUPPORTEDPROTOCOL and meant this
      # image had never been built successfully by anyone. See the Dockerfile
      # header and /.dockerignore.
      context: .
      dockerfile: packages/dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WORKFLOW_POSTGRES_URL: postgres://${POSTGRES_USER:-evestack}:${POSTGRES_PASSWORD:-evestack}@postgres:5432/${POSTGRES_DB:-evestack}
      EVESTACK_AGENT_URL: ${EVESTACK_AGENT_URL:-http://host.docker.internal:2000}

      # Required. Both halves, or the dashboard serves nothing — and the user is
      # deliberately not defaulted here either: lib/agent-client.ts attaches
      # Basic to agent calls only when BOTH are set, so a deployment with just a
      # password would sign in happily and then 401 against the agent with
      # nothing in the UI able to explain it.
      EVESTACK_AUTH_USER: ${EVESTACK_AUTH_USER:-}
      EVESTACK_AUTH_PASSWORD: ${EVESTACK_AUTH_PASSWORD:-}

      # Cookie signing key. Defaults inside the app to a value derived from the
      # password, so changing the password invalidates outstanding cookies. Set
      # it to rotate sessions without rotating the shared credential.
      EVESTACK_SESSION_SECRET: ${EVESTACK_SESSION_SECRET:-}
      EVESTACK_SESSION_TTL_HOURS: ${EVESTACK_SESSION_TTL_HOURS:-}

      # The shared secret POST /api/ingest/v1/traces expects, sent by the agent
      # as `x-evestack-ingest-token`. The agent needs the SAME value beside its
      # EVESTACK_DASHBOARD_URL. Unset, that route falls back to session auth —
      # never to open.
      EVESTACK_INGEST_TOKEN: ${EVESTACK_INGEST_TOKEN:-}

      # Until this is set, X-Forwarded-User / X-Forwarded-Email / your own
      # EVESTACK_APPROVER_HEADER are not read at all, and the audit log records
      # the installation rather than a person. Set it only when a proxy you
      # control terminates every request AND strips inbound X-Forwarded-*.
      EVESTACK_TRUSTED_PROXY: ${EVESTACK_TRUSTED_PROXY:-}
      EVESTACK_APPROVER_HEADER: ${EVESTACK_APPROVER_HEADER:-}
      EVESTACK_REQUIRE_APPROVER: ${EVESTACK_REQUIRE_APPROVER:-}

      # Set when the dashboard sits behind a different hostname than it sees on
      # the request: OAuth callback URLs, the `Secure` cookie decision, and the
      # cross-site write check all read it.
      EVESTACK_PUBLIC_URL: ${EVESTACK_PUBLIC_URL:-}

      # Use the same key and user id as the agent, or the dashboard connects
      # accounts the agent cannot see.
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      EVESTACK_COMPOSIO_USER_ID: ${EVESTACK_COMPOSIO_USER_ID:-}

      # Where the Skills page reads from. Points at the mount below; both halves
      # are needed or it silently falls back — see the volume's comment.
      EVESTACK_SKILLS_DIR: /agent-skills
    volumes:
      # The template's skills FROM THE HOST, not the copy baked into the image.
      #
      # lib/skills.ts falls back to `/repo/templates/default/agent/skills`, which
      # the Dockerfile COPYs in — so without this mount the page reads a snapshot
      # frozen at image build time. On this compose file that is the same
      # directory by name, which is exactly what makes it easy to miss: edit a
      # skill here, reload the page, and nothing changes until the image is
      # rebuilt.
      #
      # Read-only. The dashboard has no reason to write here.
      - ./templates/default/agent/skills:/agent-skills:ro
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Two names for one profile. `full` is what this file has always used and
    # what docs/self-hosting.mdx has told readers to type; `dashboard` is what a
    # scaffolded project uses, and a reader moving between the two files should
    # not have to notice which one they are in.
    profiles: ["full", "dashboard"]

volumes:
  evestack-pgdata:
