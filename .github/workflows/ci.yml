name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deliberately does NOT run `eve eval`: it drives a real model through a real
# Docker sandbox, which means a model API key as a repo secret and Docker
# available in the runner. That's real money spent on every PR from a fork,
# including malicious ones probing for spend. Typecheck and build catch the
# large majority of regressions for free; eval stays a local/maintainer gate
# documented in CONTRIBUTING.md.
#
# A key is not the only way to run it, though, and CONTRIBUTING.md now says so:
# the suite passes on the $0 Ollama path with no key anywhere (measured — 4 evals,
# 13 gates, 37.6s, sandbox included). A contributor should not believe the gate
# they are asked to run costs money. It still does not belong in this workflow: a
# runner would pull a 5.2 GB model before every job. Different reason, same answer.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here, or in any other job. Given one while package.json
      # also has `packageManager`, the action refuses to install at all —
      # "Error: Multiple versions of pnpm specified" — which killed every run
      # of this workflow in ~15s, before any real step ever executed. Left
      # bare, the action reads packageManager, so the pin lives in exactly one
      # place.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace packages publish their types from dist/, which is gitignored —
      # so a clean checkout has no dist and a bare `pnpm -r typecheck` dies on
      # TS2307 before checking a line of real code. Local trees never see this
      # because dist/ is warm there; only CI starts cold.
      #
      # `--if-present` across every package rather than naming them: this broke
      # twice, both times because a new package was added and nobody remembered
      # to extend a hardcoded list. A list that must be maintained by memory is
      # a list that will be wrong.
      - run: pnpm -r --if-present run build
      - run: pnpm -r typecheck
      # packages/dashboard/lib/pricing.ts is generated the same way, from
      # Vercel's public model catalog — which raises the obvious objection: a
      # check against a live upstream goes red when a provider reprices
      # overnight, or when the catalog is merely slow, on a PR that touched
      # nothing. That step would be worse than no step.
      #
      # It does not do that. `--check` never opens a socket: it reads the
      # `// N models. sha256:…` line the generator wrote into the marked region
      # and re-hashes the table beneath it. So it answers the one question CI
      # can actually own — was a generated price hand-edited, or the region
      # truncated — and stays silent about freshness, which is answered by
      # `git log -1 packages/dashboard/lib/pricing.ts` instead. Confirmed
      # offline by running it with `globalThis.fetch` replaced by a throwing
      # stub: still exits 0.
      #
      # Needs no install and no build — node, fs and crypto only.
      - run: node packages/dashboard/scripts/gen-pricing.mjs --check

      # CHANGELOG.md has to be REACHABLE, not merely present.
      #
      # It was written on 2026-08-09 and linked from nothing. README.md and
      # llms.txt are the two front doors — the first is what a person lands on,
      # the second is the file published so that language models index this repo
      # accurately — and neither mentioned it, so the only way to find 28
      # documented releases was to already know the filename.
      #
      # Nothing caught that, and the near-miss is instructive:
      # contract/contracts/16-documented-paths.contract.mjs DOES check
      # reachability in this exact direction ("a docs page that nothing links to
      # is invisible"), but it walks `docs/*.mdx` only, so a root-level document
      # is outside it in both directions — its PATH_PATTERN is anchored to
      # docs|packages|contract|templates|registry|scripts|.github, and
      # `CHANGELOG.md` starts with none of those. That contract is the right
      # long-term home for this rule; this step is the version of it that exists
      # today, and it is deliberately dumber: two greps, no Node, no install.
      #
      # Grepping for the FILENAME rather than a full markdown link on purpose.
      # README.md links it relatively (`./CHANGELOG.md`) and llms.txt links it as
      # an absolute github.com blob URL; a pattern strict enough to match both
      # would be strict enough to break on a reformat, and the question here is
      # only "can a reader get there from here".
      - name: CHANGELOG.md is reachable from both front doors
        run: |
          set -euo pipefail
          missing=0
          for door in README.md llms.txt; do
            if grep -q 'CHANGELOG\.md' "$door"; then
              echo "$door links CHANGELOG.md"
            else
              echo "::error file=$door::$door does not link CHANGELOG.md. It is one of the two front doors to this repository; a changelog nothing links to is a changelog nobody reads."
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1

  # The workspace's own tests. `pnpm test` at the root is
  # `node contract/run.mjs && node --test 'contract/runtime/lib/*.test.mjs' &&
  # pnpm -r --if-present test`, and docs/upgrading.mdx has told readers it runs
  # since it was written — but no workflow invoked it, so the 19 cron-parser
  # tests, create-evestack's syntax checks and the entire website Playwright
  # suite had never once run in CI. That is now this job.
  #
  # Separate from `typecheck` because it needs a browser download and a Next
  # build; folding it in would put two minutes in front of the fast feedback
  # everything else depends on.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same cold-checkout rule as every other job: workspace types and the
      # dashboard's cron import both resolve through a gitignored dist/.
      - run: pnpm -r --if-present run build

      # The two contract runners' OWN regression suite, ahead of the browser
      # download, for the same reason dashboard-build runs the dashboard's unit
      # tests before `next build`: it takes about five seconds and it guards the
      # thing everything else in this workflow trusts.
      #
      # contract/ is not a pnpm workspace package, so `pnpm -r --if-present test`
      # never reached this file and neither did any step here — the suite that
      # proves `--only=seem` (a typo) can no longer print "0 probes, 0 checks —
      # all green" and exit 0 was itself running nowhere. It is now in the root
      # `test` script as well, so `pnpm test` below re-runs it; that duplication
      # is the same deliberate trade dashboard-build documents. This step is the
      # fast, separately-named signal, and the root script is the promise
      # docs/upgrading.mdx makes that `pnpm test` runs everything.
      #
      # The quotes around the glob are load-bearing: node must do the expansion,
      # not the shell. Node's --test rejects a bare directory, and an unquoted
      # pattern that matches nothing would be handed through as a literal path.
      #
      # After `pnpm -r --if-present run build` on purpose. The test file itself
      # imports only node builtins, but it spawns both runners as real
      # subprocesses — that is the only place an exit code can be observed — and
      # those load node_modules/eve plus the probe modules.
      #
      # Counted before it is run, because `node --test` exits 0 when its glob
      # matches NOTHING. Measured: `node --test 'nosuchdir/*.test.mjs'` reports
      # `tests 0 / pass 0 / fail 0` and exits 0. So a renamed directory, or this
      # suite simply never being staged, turns a step whose name promises
      # coverage into a green no-op — which is the precise vacuity the suite
      # below was written to forbid, reproduced in the harness that runs it.
      - name: contract runner regression suite
        run: |
          found=$(ls contract/runtime/lib/*.test.mjs 2>/dev/null | wc -l)
          if [ "$found" -lt 1 ]; then
            echo "::error::no contract/runtime/lib/*.test.mjs matched — the suite is not in the commit, and node --test would have exited 0 having run nothing"
            exit 1
          fi
          echo "running $found runner-regression file(s)"
          node --test 'contract/runtime/lib/*.test.mjs'

      # chromium only — the suite pins one browser, and --with-deps pulls the
      # system libraries a bare runner does not have.
      - run: pnpm --filter @evestack/website exec playwright install --with-deps chromium
      # A deliberate, fixed timezone. templates/default's date handling has had
      # a UTC-vs-local bug before, and a runner that is always UTC makes that
      # class of bug invisible — a green suite here would mean "no test ran in a
      # timezone where it could fail".
      - run: pnpm test
        env:
          TZ: America/New_York

  # The runtime tier: the checks that need the stack to actually be running.
  #
  # This runs on a GitHub-hosted runner deliberately. The full stack — Postgres,
  # a booted agent, and a Docker sandbox container per session — does not fit on
  # the 8 GB laptop this project is developed on; eve re-enqueues active runs at
  # startup and spawning their sandboxes took that machine down. ubuntu-latest is
  # free and unlimited for public repos at 4 vCPU / 16 GB with Docker
  # preinstalled, which is exactly the missing capability.
  #
  # No model key is used or needed. Every probe is deterministic: the HTTP probe
  # only sends requests a correct eve rejects before it reaches a provider, so a
  # request that DOES reach one is the bug being hunted rather than a cost.
  # Model-dependent verification is `eve eval`, which is a separate, gated job.
  runtime:
    runs-on: ubuntu-latest
    services:
      # Same image as the compose file the scaffolder writes, so this is the
      # database users actually get rather than a plain postgres that happens to
      # be close enough.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: evestack
          POSTGRES_PASSWORD: evestack
          POSTGRES_DB: evestack
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U evestack -d evestack"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      WORKFLOW_POSTGRES_URL: postgres://evestack:evestack@localhost:5433/evestack
      # Deliberate and not UTC. The template has had a UTC-vs-local date bug
      # before, and a runner that is always UTC makes that class of bug
      # invisible — a green run would mean "nothing was tested anywhere it could
      # fail".
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build

      # A SECOND database, seeded, that the probes read — and that the agent
      # never touches.
      #
      # Most probes build a scratch schema and are indifferent to what is here.
      # Two are not, on purpose: 07-fact-tables cross-checks every fact total
      # against `workflow.workflow_runs` itself, and 08-metric-query runs every
      # catalog entry against the real table rather than a paraphrase of it —
      # which is the only way either catches drift between the shipped SQL and
      # the shipped schema. Run against the empty database this job used to
      # provide, 07 threw `42P01` and 08 failed four assertions that are all
      # anti-vacuity guards:
      #
      #     the fixture actually exercises partial coverage      0 of 0 turns have a TTFT
      #     failure_rate is lib/monitors.ts's failure rate       expected 0, actual null
      #     …and the check is not vacuous                        0 of 0
      #     a limit that cuts the result says so                 truncated=false rows=0
      #
      # That is the probe refusing to report a pass it did not earn, which is the
      # same doctrine as the negative control. It needs rows, not a bug fix.
      #
      # SEPARATE, not the agent's, and that is the whole design. The seed
      # contains RUNNING sessions — eve re-enqueues active runs on startup and
      # the Docker sandbox spawns one container per durable session, so seeding
      # the database the agent boots against would hand "boot the agent" a
      # sandbox storm. The next step's comment already promises a fresh database
      # for exactly that reason; this keeps that promise rather than working
      # around it.
      #
      # ensure-schemas.mjs is needed because the dashboard creates evestack.spans
      # and the four budget tables lazily, on first read or write. A seeder is a
      # pile of INSERTs with nothing to trigger the lazy path, so without it psql
      # stops on `relation "evestack.budget_steps" does not exist` and reads
      # every COPY line after it as a command.
      #
      # seed.mjs writes its progress line to STDERR and the SQL to stdout. Do not
      # add `2>&1` here: it puts `seed: 3322 runs, …` into the file as line one
      # and psql fails on `syntax error at or near "seed"`.
      - name: a seeded database for the probes, separate from the agent's
        env:
          PGURL: postgres://evestack:evestack@localhost:5433
        run: |
          set -euo pipefail
          psql "$PGURL/evestack" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE evestack_probe'
          export WORKFLOW_POSTGRES_URL="$PGURL/evestack_probe"
          (cd templates/default && npm run db:bootstrap)
          (cd packages/dashboard && node --import ./test/register-ts-resolve.mjs scripts/ensure-schemas.mjs)
          node packages/dashboard/scripts/seed.mjs > /tmp/probe-seed.sql
          psql "$PGURL/evestack_probe" -q -v ON_ERROR_STOP=1 -f /tmp/probe-seed.sql
          psql "$PGURL/evestack_probe" -tAc "SELECT 'seeded runs: ' || count(*) FROM workflow.workflow_runs"

      # Postgres-only and filesystem-only probes first. They are fast, they need
      # no agent, and if they fail there is no point booting one.
      # --exclude=seam, and the reason is worth writing down because the obvious
      # version of this step is subtly broken.
      #
      # `--require` is greedy on purpose: a probe is required when ANY of its
      # `needs` is named, which is what stops one skipping past a prerequisite
      # that is actually present. seam/trace-ingest-lands-in-postgres needs
      # postgres AND the dashboard, so this step demanded it and it failed on a
      # dashboard that is not booted until two steps later.
      #
      # The tempting fix — drop `postgres` from that probe's `needs` so the
      # greedy rule stops catching it — would put a lie in the one field the
      # runner uses to decide what is safe to demand. The group is excluded here
      # instead, and demanded in the step that provides both.
      - name: probes that need only Postgres
        env:
          WORKFLOW_POSTGRES_URL: postgres://evestack:evestack@localhost:5433/evestack_probe
        run: node contract/runtime/run.mjs --require=postgres,typescript --exclude=seam

      # A FRESH database for the agent, created per run, so nothing is ever
      # re-enqueued from a previous job. That is not tidiness: re-enqueued runs
      # each spawn a sandbox, which is what makes booting the agent expensive.
      - name: boot the agent
        id: agent
        run: |
          cd templates/default
          npm run db:bootstrap

          # Channel credentials, so the inbound-auth probe has something real to
          # verify against. Without them eve leaves the three routes idle and the
          # probe can only skip — which is how a signature check that had never
          # been tested stayed untested.
          #
          # None of these is a secret. The agent lives for the length of one job,
          # the two shared secrets are literals, and the Ed25519 pair is generated
          # here and thrown away. The private half goes to a file because the
          # probe runs in a later step and has to sign with it; the public half is
          # what the agent verifies against, so it has to be exported before boot
          # rather than through $GITHUB_ENV, which only reaches later steps.
          node -e '
            const { generateKeyPairSync } = require("node:crypto");
            const { writeFileSync } = require("node:fs");
            const { publicKey, privateKey } = generateKeyPairSync("ed25519");
            writeFileSync("/tmp/discord-probe-key.pem", privateKey.export({ type: "pkcs8", format: "pem" }));
            // The last 32 bytes of the SPKI DER are the raw key, which is the hex
            // form Discord publishes and eve expects.
            process.stdout.write(publicKey.export({ type: "spki", format: "der" }).subarray(12).toString("hex"));
          ' > /tmp/discord-public-key.txt
          export DISCORD_PUBLIC_KEY="$(cat /tmp/discord-public-key.txt)"
          export TELEGRAM_BOT_TOKEN=123456789:AA-ci-probe-token-not-a-real-bot
          export TELEGRAM_WEBHOOK_SECRET_TOKEN=ci-telegram-secret
          export SLACK_BOT_TOKEN=xoxb-ci-probe-not-a-real-token
          export SLACK_SIGNING_SECRET=ci-slack-signing-secret

          # THE SAME PAIR THE DASHBOARD USES, and it has to be the same pair.
          # lib/auth.ts is explicit that create-evestack generates one
          # EVESTACK_AUTH_USER / EVESTACK_AUTH_PASSWORD for the agent and
          # lib/agent-client.ts sends it onward as Basic — one secret to rotate,
          # not two that drift. Booting the agent without it while the dashboard
          # has it is a configuration no real install has, and it showed up
          # exactly where you would expect: every fleet sweep classified its
          # sessions `unknown`, which is the honest report of "I could not reach
          # the agent" for a mismatch this job created.
          export EVESTACK_AUTH_USER=probe
          export EVESTACK_AUTH_PASSWORD=probe-password-not-a-secret

          # No model key on purpose — see the note above the job.
          npx eve dev --port 2999 > /tmp/eve-dev.log 2>&1 &
          echo $! > /tmp/eve-dev.pid

          # Wait for it, with a bound. A boot that never completes must fail the
          # job rather than hang it until the 6h ceiling.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:2999/ 2>/dev/null; then
              echo "agent up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the agent did not answer on :2999 within 60s"
          cat /tmp/eve-dev.log
          exit 1

      # The dashboard, against the agent that is now up and the database that
      # agent writes to.
      #
      # It has never run in this job, and four paths went untested because of
      # it: chat streaming, an approval decision travelling eve's follow-up
      # route, the fleet classifier's agent-dependent branches, and trace ingest
      # end to end. Each is dashboard -> agent or exporter -> dashboard ->
      # Postgres, so no amount of probing either end alone reaches them. Every
      # bug this repo has found in that seam — the tail-index-of-minus-one
      # confusion, the 15-second sessions page, the proxy comparing Origin to
      # the bind address — was found by a person, by hand, after shipping.
      #
      # The agent's database, NOT evestack_probe: the point is to watch the
      # dashboard read rows the agent has just written, which the seeded copy
      # cannot show.
      #
      # No model key here either. Every assertion is about protocol and storage:
      # a turn that never reaches a provider still opens a stream, still emits
      # terminal events, and still leaves run rows to classify.
      - name: boot the dashboard
        env:
          WORKFLOW_POSTGRES_URL: postgres://evestack:evestack@localhost:5433/evestack
          EVESTACK_AGENT_URL: http://localhost:2999
          EVESTACK_AUTH_USER: probe
          EVESTACK_AUTH_PASSWORD: probe-password-not-a-secret
          EVESTACK_SESSION_SECRET: probe-session-secret-not-a-secret
          EVESTACK_INGEST_TOKEN: probe-ingest-token-not-a-secret
          EVESTACK_PUBLIC_URL: http://localhost:4009
        run: |
          cd packages/dashboard
          node_modules/.bin/next start --port 4009 > /tmp/dashboard.log 2>&1 &
          echo $! > /tmp/dashboard.pid

          # /api/health is the liveness tier and is deliberately reachable
          # without a credential, so this waits on the same route Docker's
          # HEALTHCHECK uses rather than on one that would 401.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:4009/api/health 2>/dev/null; then
              echo "dashboard up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the dashboard did not answer on :4009 within 60s"
          cat /tmp/dashboard.log
          exit 1

      - name: probes that need the agent
        env:
          EVESTACK_PROBE_AGENT_URL: http://localhost:2999
          # Must match what the boot step exported. Two literals rather than a
          # shared variable because a step's exports do not survive into the next
          # step, and a mismatch here would look exactly like a broken signature
          # check — so the probe fails loudly on a wrong secret rather than
          # skipping on a missing one.
          TELEGRAM_WEBHOOK_SECRET_TOKEN: ci-telegram-secret
          SLACK_SIGNING_SECRET: ci-slack-signing-secret
        # Two invocations, because --only takes one substring, not a list.
        run: |
          export EVESTACK_PROBE_DISCORD_PRIVATE_KEY="$(cat /tmp/discord-probe-key.pem)"
          node contract/runtime/run.mjs --require=agent --only=protocol
          node contract/runtime/run.mjs --require=agent --only=channels

      # The seam: dashboard -> agent, and exporter -> dashboard -> Postgres.
      #
      # --require=dashboard, so a dashboard that failed to boot fails the job
      # rather than skipping four probes and reporting green. That is the same
      # rule the rest of this tier follows and the reason --require exists.
      - name: probes that need the dashboard and the agent together
        env:
          EVESTACK_PROBE_AGENT_URL: http://localhost:2999
          EVESTACK_PROBE_DASHBOARD_URL: http://localhost:4009
          EVESTACK_PROBE_DASHBOARD_USER: probe
          EVESTACK_PROBE_DASHBOARD_PASSWORD: probe-password-not-a-secret
          EVESTACK_PROBE_INGEST_TOKEN: probe-ingest-token-not-a-secret
          WORKFLOW_POSTGRES_URL: postgres://evestack:evestack@localhost:5433/evestack
        run: node contract/runtime/run.mjs --require=dashboard,agent,postgres --only=seam

      - name: the dashboard's own log
        if: always()
        run: |
          echo "── dashboard log ────────────────────────────────────────────"
          cat /tmp/dashboard.log || echo "(no log)"
          kill "$(cat /tmp/dashboard.pid)" 2>/dev/null || true

      - name: the agent's own log
        # Always: a probe failure is usually explained by what the agent logged
        # while it was being probed, and losing that means re-running the job to
        # find out.
        if: always()
        run: |
          echo "── eve dev log ──────────────────────────────────────────────"
          cat /tmp/eve-dev.log || echo "(no log)"
          kill "$(cat /tmp/eve-dev.pid)" 2>/dev/null || true

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ONE workspace dependency, built first, and no more than that.
      #
      # `test/schedules-next-fire.test.mjs` checks the page's projection against
      # @evestack/schedules' own `nextFire()` — the function the runner actually
      # fires on — which is the only oracle that can say whether the two agree.
      # That import resolves through package exports to a gitignored `dist/`, so
      # on a cold checkout the whole dashboard suite dies with ERR_MODULE_NOT_FOUND
      # before running a single test. It did, for exactly one commit.
      #
      # This is the third job to meet that trap; the note below records the first
      # two. Building the one package it needs keeps the fast signal intact —
      # `tsc` on a package this size is a couple of seconds against the two
      # minutes a full workspace build costs.
      - run: pnpm --filter @evestack/schedules run build
      # Before the Next build, deliberately. The dashboard's unit tests import
      # lib/auth.ts, lib/pricing.ts, lib/traces.ts and lib/promote-eval.ts
      # directly under `node --test`; apart from the oracle above, their import
      # graph is node builtins plus `pg` — no Next entry point — so they need no
      # Next build and they finish in about 300ms. Running them ahead of a
      # two-minute `next build` is the difference between learning that
      # default-deny routing broke in seconds and learning it after the compile.
      #
      # These also run inside the `test` job via the root `pnpm test`, which is
      # `pnpm -r --if-present test`. That is not redundant on purpose: this step
      # is the fast signal, that one is the promise docs/upgrading.mdx makes
      # that `pnpm test` runs everything.
      - run: pnpm --filter @evestack/dashboard test
      # Same cold-checkout problem as the typecheck job: the dashboard imports
      # @evestack/schedules/cron, which resolves to a gitignored dist/, so
      # Turbopack fails with "Module not found" on a fresh clone. Every job that
      # compiles the dashboard has to build the workspace first — fixing only
      # the typecheck job left this one red for exactly one commit.
      - run: pnpm -r --if-present --filter '!@evestack/dashboard' run build
      # No real Postgres in this job — next build only needs the schema to
      # typecheck, not a live connection, since all queries are server-only
      # code that Next traces but does not execute at build time.
      - run: pnpm --filter @evestack/dashboard build

  scaffolder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: node --check packages/create-evestack/index.mjs
      - run: pnpm install --frozen-lockfile
      - run: node packages/create-evestack/scripts/sync-template.mjs

      - name: substitute the workspace build of every @evestack dependency
        # The scaffolded template depends on our own packages, which only exist
        # on the public registry after a release. Resolving them from npm means
        # this job 404s on any package added since the last publish — and, worse,
        # tests the LAST PUBLISHED build rather than the one in this commit, so a
        # broken package passes CI until someone publishes it.
        #
        # Every @evestack dependency is therefore packed from the workspace and
        # substituted. Discovered by iterating the manifest rather than by a
        # hardcoded list, because the previous version named @evestack/composio
        # alone and broke the moment a third package was added.
        run: |
          pnpm -r --if-present run build
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const p = "packages/create-evestack/template/package.json";
            const manifest = JSON.parse(fs.readFileSync(p, "utf8"));

            // package directory names do not match their scoped npm names
            // (@evestack/budget lives in packages/evestack-budget), so the map
            // is built from the workspace rather than guessed from the name.
            const dirs = fs.readdirSync("packages");
            const byName = new Map();
            for (const dir of dirs) {
              const file = `packages/${dir}/package.json`;
              if (!fs.existsSync(file)) continue;
              byName.set(JSON.parse(fs.readFileSync(file, "utf8")).name, dir);
            }

            // Every dependency FIELD, not just `dependencies`. sync-template.mjs
            // pins `workspace:` ranges in devDependencies too, so an @evestack/*
            // devDependency was rewritten to ^<unpublished version> and then
            // resolved from the public registry — the exact "tests the last
            // published build, or 404s on a package added since" failure this
            // step exists to prevent. It failed loudly, but for a reason that
            // pointed at npm rather than at here. Nothing slips through today;
            // this is so that stays true when someone adds one.
            const FIELDS = ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"];
            for (const field of FIELDS) {
              for (const [dep, range] of Object.entries(manifest[field] ?? {})) {
                if (!dep.startsWith("@evestack/")) continue;
                // A peer range is a compatibility statement, not something to
                // resolve, so naming it is the whole fix.
                if (field === "peerDependencies") {
                  console.log(`${dep} is a peerDependency (${range}); left alone`);
                  continue;
                }
                const dir = byName.get(dep);
                if (!dir) throw new Error(`${dep} is not a workspace package`);
                const out = execSync(`npm pack --pack-destination /tmp ./packages/${dir}`)
                  .toString().trim().split("\n").pop();
                manifest[field][dep] = `file:/tmp/${out}`;
                console.log(`${field}.${dep} ${range} -> file:/tmp/${out}`);
              }
            }
            fs.writeFileSync(p, JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: non-interactive scaffold smoke test
        run: |
          cd /tmp
          node ${{ github.workspace }}/packages/create-evestack/index.mjs ci-smoke-test --yes
          test -f ci-smoke-test/.gitignore
          test -f ci-smoke-test/.env.local
          ! grep -q '^EVESTACK_AUTH_PASSWORD=$' ci-smoke-test/.env.local
          # The install is the whole point. Asserting only that files exist is
          # what let a scaffolder that 404s on install, prints a green "Done."
          # and exits 0 pass this job.
          test -d ci-smoke-test/node_modules/eve
          # Every @evestack dependency the template declares must actually be
          # installed, not just the one somebody thought to assert.
          node -e '
            const fs = require("fs");
            const deps = JSON.parse(fs.readFileSync("ci-smoke-test/package.json", "utf8")).dependencies;
            for (const dep of Object.keys(deps)) {
              if (!dep.startsWith("@evestack/")) continue;
              if (!fs.existsSync(`ci-smoke-test/node_modules/${dep}`)) {
                console.error(`${dep} is declared but was not installed`);
                process.exit(1);
              }
              console.log(`${dep} installed`);
            }
          '

      - name: scaffolds from an npx-shaped install path
        # `npx` stages the package under
        # ~/.npm/_npx/<hash>/node_modules/create-evestack/template, so every
        # source path contains "node_modules". A template filter tested against
        # the absolute path therefore copied nothing and `npx create-evestack`
        # produced an empty directory — while passing from a monorepo checkout,
        # which is why it was never caught here.
        run: |
          npm pack --ignore-scripts --pack-destination /tmp ./packages/create-evestack
          mkdir -p /tmp/npx-sim/node_modules
          tar xzf /tmp/create-evestack-*.tgz -C /tmp/npx-sim
          mv /tmp/npx-sim/package /tmp/npx-sim/node_modules/create-evestack
          cd /tmp/npx-sim
          node node_modules/create-evestack/index.mjs npx-agent --yes
          test -f npx-agent/package.json
          test -f npx-agent/agent/agent.ts
          test -f npx-agent/lib/memory.ts
          test -d npx-agent/node_modules/eve

      - name: every publishable package carries a README and a LICENSE
        # A package published without a README renders "This package does not
        # have a README" on the one page the whole launch funnels through.
        #
        # THE LIST IS DERIVED, and it used to be three names typed here:
        #
        #     for pkg in create-evestack evestack-composio sandbox-opensandbox
        #
        # There are seven publishable packages. @evestack/budget, evestack (the
        # CLI), @evestack/mcp and @evestack/schedules are every bit as publishable
        # — none carries `private: true` — and none of them was checked, under a
        # step named "every". All four happen to have both files, so this widening
        # is not a fix for a missing README; it is a fix for a check that was
        # asserting something four sevenths less than it claimed.
        #
        # It is also the exact failure this workflow already has a note about, in
        # the typecheck job: "this broke twice, both times because a new package
        # was added and nobody remembered to extend a hardcoded list. A list that
        # must be maintained by memory is a list that will be wrong." That lesson
        # was applied to `pnpm -r --if-present` and not here.
        #
        # `private: true` is the same signal `pnpm -r publish` obeys, so this asks
        # the question npm will ask rather than a paraphrase of it.
        run: |
          set -euo pipefail
          count=0
          for manifest in packages/*/package.json; do
            dir="$(dirname "$manifest")"
            name="$(node -p "const p=require('./$manifest'); p.private ? '' : p.name")"
            [ -n "$name" ] || continue
            count=$((count + 1))
            test -f "$dir/README.md" || { echo "::error::$dir/README.md is missing, and $name is published"; exit 1; }
            test -f "$dir/LICENSE"   || { echo "::error::$dir/LICENSE is missing, and $name is published"; exit 1; }
            echo "  $name — README and LICENSE present"
          done
          # Anti-vacuity: a glob that matched nothing, or a `private` check that
          # started excluding everything, would sail through the loop having
          # verified nothing at all — which is the shape of the bug above.
          if [ "$count" -lt 5 ]; then
            echo "::error::only $count publishable packages were found; the derivation is broken and this step checked almost nothing"
            exit 1
          fi
          echo "$count publishable packages checked"

      - name: generated .env.local is actually ignored by git
        # The file existing is not the point — git refusing to stage it is.
        # In real use it holds a live API key, so a .gitignore that silently
        # stops matching it is the one regression here that cannot be undone.
        run: |
          cd /tmp/ci-smoke-test
          git init -q .
          git add -A
          if git status --short | grep -q '\.env\.local'; then
            echo "FAIL: .env.local would be committed"
            exit 1
          fi
          echo "secrets ignored"

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node registry/build.mjs

      # THE gate. Every assertion below this step describes the JSON that
      # `node registry/build.mjs` just wrote into this checkout — content is
      # non-empty, versions are pinned — and every one of them is just as happy
      # with a file generated thirty seconds ago as with the file users actually
      # download. Nothing compared the two. So an edit to templates/default
      # without a regeneration left the committed items stale and this job green,
      # which is the exact failure the whole "inline from the real source"
      # design exists to prevent.
      #
      # Not hypothetical. Items inline templates/default/agent/sandbox/sandbox.ts
      # and templates/default/agent/agent.ts verbatim as JSON string content;
      # both changed, the committed JSON silently went stale, and it was caught
      # by hand. This check is why that cannot happen again.
      - name: the committed registry matches templates/default
        run: |
          # Untracked first: git diff is blind to a registry/r/*.json that
          # build.mjs created for a brand-new item and nobody committed, and an
          # item the catalog advertises but the repo does not carry is a 404 on
          # `eve add`.
          untracked="$(git ls-files --others --exclude-standard -- registry/)"
          if [ -n "$untracked" ]; then
            echo "::error file=registry/build.mjs::A generated registry file was never committed:"
            echo "$untracked"
            exit 1
          fi

          # `--exit-code` is the assertion; `--quiet` stops it dumping the patch,
          # because an item diff is an entire TypeScript file inlined as one
          # JSON string and the raw hunk is a handful of thousand-column lines.
          # The bounded summary below is printed instead, wide lines truncated,
          # which is enough to see which item and which target moved.
          if ! git diff --exit-code --quiet -- registry/; then
            echo "::error file=registry/build.mjs::registry/r/ is stale. Run 'node registry/build.mjs' and commit the result."
            git diff --stat -- registry/
            git diff -- registry/ | cut -c1-200 | head -40
            exit 1
          fi
          echo "registry/r/ is byte-identical to a fresh build from templates/default"

      - name: every registry item has non-empty inlined content
        run: |
          node -e '
            const fs = require("fs");
            for (const f of fs.readdirSync("registry/r")) {
              if (f === "registry.json") continue;
              const item = JSON.parse(fs.readFileSync(`registry/r/${f}`, "utf8"));
              for (const file of item.files ?? []) {
                if (!file.content || file.content.length < 20) {
                  console.error(`${f}: empty or near-empty content for ${file.target}`);
                  process.exit(1);
                }
              }
            }
          '

      - name: registry items pin versions, and pin the tested ones
        # A bare name means "whatever npm calls latest today", which is how
        # `eve add @evestack/memory` installed @ai-sdk/openai@4 beside code only
        # ever exercised against v2.
        run: |
          node -e '
            const fs = require("fs");
            const template = JSON.parse(fs.readFileSync("templates/default/package.json", "utf8"));
            let failed = false;
            for (const f of fs.readdirSync("registry/r")) {
              if (f === "registry.json") continue;
              const item = JSON.parse(fs.readFileSync(`registry/r/${f}`, "utf8"));
              for (const [field, source] of [["dependencies", "dependencies"], ["devDependencies", "devDependencies"]]) {
                for (const entry of item[field] ?? []) {
                  const at = entry.lastIndexOf("@");
                  const name = at > 0 ? entry.slice(0, at) : entry;
                  const range = at > 0 ? entry.slice(at + 1) : "";
                  const expected = template[source]?.[name];
                  if (!range) {
                    console.error(`${f}: ${entry} is unversioned`);
                    failed = true;
                  } else if (range !== expected) {
                    console.error(`${f}: ${entry} does not match templates/default (${expected ?? "absent"})`);
                    failed = true;
                  }
                }
              }
            }
            process.exit(failed ? 1 : 0);
          '
