# Build and push the dashboard image to GHCR.
#
# This workflow is the thing that removes the single biggest piece of friction
# in evestack. Until it has run once, a scaffolded project's
# `docker compose --profile dashboard up -d` ends at `manifest unknown`, and the
# only way to a dashboard is a monorepo clone plus a `docker build` — the step
# the scaffolder and every setup doc used to have to print an apology for.
#
# It is release-gated, not push-gated. `packages/dashboard` changes on most PRs
# and none of those are a version anyone should be pulling, so the PR signal
# lives in dashboard-image.yml — which builds this same file and then RUNS the
# container. This one publishes.
#
# That sentence used to read "ci.yml's `dashboard-build` job already proves the
# image compiles on every commit", and it was not true. `dashboard-build` runs
# `next build`; it produces the application, never an image, and has no idea
# this Dockerfile exists. For as long as that comment stood, the honest summary
# of PR-time image coverage was: none.
#
#   git tag -a '@evestack/dashboard@0.3.0' -m 'dashboard 0.3.0'
#   git push origin '@evestack/dashboard@0.3.0'
#
# That is the repository's tag convention — `<package name>@<version>` — and it
# is written down once, in RELEASING.md ("Tag convention"), not here. The two
# releases that exist used `dashboard-v0.1.0` and `dashboard-v0.2.0`, which
# predate the decision. Those tags are public and are not renamed, so BOTH forms
# are still accepted below: the old one exists so `dashboard-v0.2.0` can be
# re-run from the Actions tab, and for no other reason. Nothing new should use
# it. Verified that git accepts the scoped form, `/` and leading `@` included:
# `git check-ref-format refs/tags/@evestack/dashboard@0.3.0` passes, and the tag
# round-trips through `tag -l`, `rev-parse` and `describe`.
#
# The tag has to agree with packages/dashboard/package.json and with the tag the
# scaffolder writes into every generated docker-compose.yml. Both are checked
# below and both are fatal, because the failure they prevent is silent: a
# release that publishes :0.1.1 while every scaffold asks for :0.1.0 looks
# entirely successful here and is a 404 for every user.
name: Publish dashboard image

on:
  push:
    tags:
      # `*` does not match `/` in these filters, and there is no `/` after the
      # last one in either pattern, so both are exact-prefix matches on the
      # version.
      - "@evestack/dashboard@*"
      - "dashboard-v*"
  # For the first publish, and for re-running one that failed after the tag
  # already existed. Same checks; nothing is skipped for a manual run — except
  # the GitHub release, which needs a tag to attach to and is therefore gated on
  # `github.ref_type == 'tag'` rather than on the event.
  #
  # workflow_dispatch accepts ANY ref, which is the property that makes the two
  # gates in `merge` necessary — see the long note on that job.
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Re-tag a version that is already published with DIFFERENT contents. Almost always wrong; read the gate in the merge job before setting it."
        required: false
        default: false
        type: boolean

# Stated rather than inherited, so that a repository whose default is "Read and
# write permissions" does not silently hand a push-to-main token to a job that
# only needs to read the tree. Every job below narrows this further; the two
# that publish say `packages: write` and the one that cuts the release says
# `contents: write`, and nothing else can write anything.
permissions:
  contents: read

concurrency:
  group: publish-dashboard-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sammytourani/evestack-dashboard

jobs:
  # ---------------------------------------------------------------------------
  # version agreement — cheap, and it runs before anything is built or pushed
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    # This job was the only one here without a block of its own, which meant it
    # ran on whatever the workflow or repository default was. It reads
    # package.json, greps the tree and reads CHANGELOG.md; `contents: read` is
    # the whole of what that needs.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      # Pinned to a commit rather than a tag, and the token not left behind in
      # `.git/config` — ci.yml's first checkout carries the full reasoning for
      # both. Nothing in this workflow talks to the git remote: `gh release`
      # uses GH_TOKEN from the environment, not git credentials, and the `git
      # grep` below reads the checkout that is already on disk.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: read
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/dashboard/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dashboard version: $version"

          # The tag, when there is one. workflow_dispatch has no tag to check —
          # it publishes whatever packages/dashboard/package.json says, which is
          # the only sane reading of a manual run.
          #
          # Two accepted forms, and only two. `@evestack/dashboard@<version>` is
          # the convention (RELEASING.md, "Tag convention"). `dashboard-v<version>`
          # is what the first two releases used; it stays accepted so that
          # dashboard-v0.1.0 and dashboard-v0.2.0 remain re-runnable, and should
          # be deleted from this case when neither is worth re-running. The error
          # names only the convention, because a NEW tag in the old form is a
          # mistake even though the check would let it through.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            case "$GITHUB_REF_NAME" in
              "@evestack/dashboard@$version") ;;
              "dashboard-v$version")
                echo "::warning::$GITHUB_REF_NAME uses the superseded tag form. New releases should be tagged @evestack/dashboard@$version."
                ;;
              *)
                echo "::error::tag $GITHUB_REF_NAME does not match packages/dashboard/package.json ($version). Expected @evestack/dashboard@$version. Bump one of them."
                exit 1
                ;;
            esac
          fi

          # And the tag the scaffolder pins every generated compose file to.
          # Read out of the source rather than re-derived, so this fails for the
          # same reason a user's pull would: the two strings differ.
          pinned="$(node -p "
            const src = require('fs').readFileSync('packages/create-evestack/shared.mjs', 'utf8');
            const m = src.match(/DASHBOARD_IMAGE_TAG = \"([^\"]+)\"/);
            m ? m[1] : '';
          ")"
          if [ "$pinned" != "$version" ]; then
            echo "::error::packages/create-evestack/shared.mjs pins DASHBOARD_IMAGE_TAG=$pinned but the dashboard is $version. Every scaffolded project would pull a tag this release does not publish."
            exit 1
          fi
          echo "scaffolder pin agrees: $pinned"

          # AND EVERY OTHER PLACE THE TAG IS WRITTEN OUT IN FULL.
          #
          # The two checks above cover the git tag and shared.mjs. They were the
          # whole gate, while `ghcr.io/sammytourani/evestack-dashboard:<version>`
          # also appears as a literal in docker-compose.yml and in
          # docs/self-hosting.mdx — neither of which anything read. The comment
          # above that compose line said "the tag tracks
          # packages/dashboard/package.json version; the publish workflow refuses
          # to release when they disagree", which was simply not true of that
          # file. A release could ship 0.2.0 while the repo's own compose file
          # and the self-hosting runbook both told readers to pull 0.1.0.
          #
          # SCANNED, not listed. A list of files here would need to be extended
          # by memory every time the tag is written somewhere new, and this
          # repository has been bitten by that shape twice already — see the note
          # on the hardcoded package list in ci.yml. `git grep` asks the question
          # directly instead: find every literal, and require them all to agree.
          # CHANGELOG.md and review/ are excluded, and they are the exclusions
          # that are about meaning rather than noise. Every other literal in the
          # tree is an instruction — "pull this" — and must therefore track the
          # release. A changelog line is a HISTORICAL statement: the 0.2.0 entry
          # records the image tag the scaffolder pinned at the time, and it will
          # still record it after the next release ships. Without the exclusion,
          # the first release cut after the changelog landed would fail on a
          # sentence that is permanently correct, and the only way to make it
          # pass would be to falsify history.
          #
          # review/ is the same shape and it deadlocked a release to prove it. A
          # review packet quotes the pin that was live while the review ran; that
          # quotation is evidence, and it stays true afterwards. The cape-town-v1
          # packet landed carrying eight quotations of the previous pin, which
          # made this gate exit 1 on the very release the review existed to
          # produce — so the fix could never ship, and the tree's pins stayed
          # 404s. Rewriting those eight lines to name a tag the review never saw
          # is the "falsify history" failure the paragraph above rules out. Note
          # the asymmetry that makes this safe: review/ lives at the repository
          # root and every publishable package carries an explicit `files`
          # allowlist, so nothing under review/ can reach an npm tarball or a
          # built image. A reader who follows a review document is reading a
          # record, never an install instruction.
          #
          # Note the shape of this comment: no version literal appears in it. An
          # earlier draft spelled the pin out as an example and the scan promptly
          # found its own explanation, adding a fifth "mismatched" hit inside this
          # very file. Do not name a concrete tag here.
          # The pattern matches any tag that STARTS with a digit, and the whole
          # matched tag is compared. Both halves of that sentence are load-bearing.
          #
          # Starting with a digit is what makes a tag a version claim. It leaves
          # the deliberately non-version tags alone — the PR-build tag in
          # dashboard-image.yml, the `local` example in the self-hosting runbook —
          # which are not release pins and must not be dragged into this gate.
          #
          # Comparing the WHOLE tag closes a hole the old pattern had. It matched
          # `[0-9][0-9.]*` and the extraction then truncated at the first
          # non-numeric character, so a pin reading <version>-rc1 produced a tag
          # string equal to <version>, compared equal, and passed — while pointing
          # at an image that does not exist. A suffixed pin is a different image
          # and must fail here.
          mismatched=0
          found=0
          while IFS= read -r hit; do
            found=$((found + 1))
            tag="${hit##*evestack-dashboard:}"
            [ -n "$tag" ] || continue
            if [ "$tag" != "$version" ]; then
              echo "::error::$hit pins $tag, but packages/dashboard/package.json is $version"
              mismatched=1
            fi
          done <<< "$(git grep -n -o -E 'evestack-dashboard:[0-9][A-Za-z0-9._-]*' -- . ':!*.lock' ':!pnpm-lock.yaml' ':!CHANGELOG.md' ':!review/' || true)"

          [ "$mismatched" = "0" ] || exit 1

          # Anti-vacuity: a grep that stopped matching would report every literal
          # as agreeing by finding none, and this is a release gate.
          if [ "$found" -lt 2 ]; then
            echo "::error::only $found pinned image tags were found in the tree; the scan is broken and this gate checked nothing"
            exit 1
          fi
          echo "$found written-out tags all agree on $version"

      # -----------------------------------------------------------------------
      # THE RELEASE NOTES MUST EXIST BEFORE ANYTHING IS PUBLISHED.
      #
      # This check was written in the `release:` job below (the "cut the GitHub
      # release from CHANGELOG.md" step, publish-dashboard.yml:369 as it stood),
      # and that is too late to be a gate. `release` needs `merge`, and `merge`
      # is the job that runs `imagetools create` — so by the time the
      # "CHANGELOG.md has no section" error fired, `:<version>` was already in
      # GHCR and `:latest` had already been moved onto it. The version tag is
      # immutable in practice (every scaffolded docker-compose.yml pins it), so
      # the only recovery was to write the changelog entry and re-run, leaving a
      # published image that no release page ever described. A gate that fires
      # after publication is not a gate; it is a report.
      #
      # Runs on EVERY invocation, including workflow_dispatch on a branch. It
      # briefly carried `if: github.ref_type == 'tag'`, mirroring `release`, on
      # the reasoning that a manual run "cuts no release at all, so demanding
      # release notes from it would invent a failure". That reasoning named the
      # wrong artifact. What this gate protects is the IMAGE, and `merge`
      # pushes `:<version>` and moves `:latest` whatever triggered the run — so
      # the condition exempted precisely the path the header above calls "the
      # first publish, and re-running one that failed", which is the path most
      # likely to be missing its changelog entry. The step only reads
      # CHANGELOG.md, so there is no cost to always running it.
      #
      # The awk program here is a deliberate copy of the one in `release`. It
      # has to be: this job must answer "is there a section" WITHOUT producing
      # the notes, and that job must produce the notes it publishes. They are
      # two uses of one rule, so if the heading format ever changes, both
      # change — and `release` keeps its own emptiness check as a backstop
      # rather than trusting this one to have run.
      - name: the CHANGELOG section this release publishes from must already exist
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          heading="### @evestack/dashboard@${VERSION}"
          awk -v h="$heading" '
            index($0, h " ") == 1 || $0 == h { found = 1; next }
            found && /^###? / { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes-probe.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/notes-probe.md"; then
            echo "::error::CHANGELOG.md has no '${heading}' section, so this release would have no notes. Add one before tagging — nothing has been published yet."
            exit 1
          fi
          echo "release notes found under '${heading}'"

  # ---------------------------------------------------------------------------
  # build — one native runner per architecture, pushed by digest
  # ---------------------------------------------------------------------------
  # arm64 is not optional: this project's whole audience runs it on a laptop, and
  # a large share of those laptops are Apple Silicon. The alternative to a second
  # runner is QEMU on ubuntu-latest, and a `next build` under emulation is the
  # kind of step that takes hours and occasionally kills the Node process
  # outright — a release path that fails that way fails at the worst moment.
  # GitHub's arm64 runners are free for public repositories, so this costs
  # nothing but the YAML.
  #
  # Each job pushes an unnamed digest; `merge` below assembles the two digests
  # into one multi-arch tag. This is Docker's documented pattern for exactly this
  # split, and it is why no `tags:` appear here — two jobs pushing the same tag
  # would race and the loser's architecture would vanish.
  build:
    needs: version
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # No secret to create. GITHUB_TOKEN can write packages owned by this
          # repository's owner, which is why `permissions: packages: write`
          # above is the entire authorisation story.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          # The repository ROOT. packages/dashboard/Dockerfile explains at
          # length why: `@evestack/schedules` is a `workspace:*` dependency that
          # resolves only against the root lockfile.
          context: .
          file: packages/dashboard/Dockerfile
          platforms: ${{ matrix.platform }}
          # Anonymous digest now, tags in `merge`. `push-by-digest` is what makes
          # two jobs able to contribute to one tag without racing.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # `org.opencontainers.image.source` is what links the package to this
          # repository on GitHub — without it the package page has no README, no
          # source link, and inherits no visibility settings.
          labels: |
            org.opencontainers.image.source=https://github.com/SammyTourani/evestack
            org.opencontainers.image.description=Self-hosted observability and control plane for eve agents
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          # Off on purpose. Provenance adds attestation entries to the manifest
          # list, which `imagetools create` below would carry through as extra
          # `unknown/unknown` platform entries — harmless but confusing on the
          # package page, and one more moving part in a path that has never run.
          provenance: false
          cache-from: type=gha,scope=dashboard-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=dashboard-${{ matrix.platform }}

      - name: export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          # The file NAME carries the digest; the file itself is empty. `merge`
          # globs the directory back into `IMAGE@sha256:…` references, which is
          # why the `sha256:` prefix is stripped here and restored there.
          touch "/tmp/digests/${DIGEST#sha256:}"
          ls -l /tmp/digests

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # merge — one tag, both architectures
  # ---------------------------------------------------------------------------
  merge:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Whether `:latest` actually moved. `release` writes a line into the
      # release notes about it and used to state it unconditionally; see the
      # note there.
      latest: ${{ steps.gate.outputs.latest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # THE TWO THINGS THIS STEP REFUSES TO DO
      # ---------------------------------------------------------------------
      #
      # The step below used to read, in full:
      #
      #   docker buildx imagetools create --tag "${IMAGE}:${version}" \
      #                                   --tag "${IMAGE}:latest" ...
      #
      # Both tags, always, whatever ref the run was started from. Combined with
      # a `workflow_dispatch` that accepts ANY ref, that is two distinct ways to
      # damage a published image with no error anywhere:
      #
      #   1. OVERWRITING A VERSION. The comment on the old step said the version
      #      tag "is immutable in practice", and that was a description of how
      #      people behave, not a property the workflow had. Dispatching on an
      #      old release tag rebuilds that version from TODAY's tree and pushes
      #      it over the published one. Every scaffolded docker-compose.yml pins
      #      a version tag, so the projects that pinned it get different code on
      #      their next pull with no version change to explain it. The failure
      #      is silent by construction: the run is green and the tag still
      #      exists.
      #
      #   2. MOVING :latest BACKWARDS, OR ONTO A BRANCH. `:latest` is the opt-in
      #      for people who track the newest, so it carries one promise —
      #      newest. A dispatch on an old tag pointed it at an old release; a
      #      dispatch on a feature branch published that BRANCH's
      #      packages/dashboard/package.json version as `:latest`, which is how
      #      an unreviewed branch becomes what `docker pull` hands a stranger.
      #
      # WHY THE CHECK IS HERE AND NOT IN `version`. This file's own doctrine is
      # that a gate belongs before anything is published — that is the whole
      # reason the CHANGELOG check moved up into `version`. This one cannot: it
      # has to ask the registry what is already there, and that needs the login
      # that only this job holds. The doctrine is still satisfied, because
      # between `version` and this line NOTHING PUBLISHED A TAG. `build` pushes
      # by digest with no tag at all; an unreferenced digest is invisible to
      # `docker pull` and is garbage-collected. The very next command is the
      # first and only mutation, so refusing here refuses before publication.
      #
      # WHAT COUNTS AS AN OVERWRITE. Not "the tag exists" — "the tag exists AND
      # would change". If a re-run yields the same child digests, the write is a
      # no-op. Builds are not guaranteed reproducible; changed child digests
      # require explicit overwrite authorization. The
      # published index's child digests are compared against the digests this
      # run is about to assemble, and only a genuine difference is refused. When
      # it IS refused, `overwrite: true` on a manual dispatch is the deliberate
      # way through, and the error says so.
      - name: refuse to overwrite a published version; decide whether :latest may move
        id: gate
        working-directory: /tmp/digests
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          # Empty string on a `push:` event — workflow inputs do not exist
          # there — which is the correct reading: a tag push never overwrites.
          OVERWRITE: ${{ inputs.overwrite }}
          REF_TYPE: ${{ github.ref_type }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # The digests this run would publish, as a sorted space-separated
          # string. The filenames in /tmp/digests ARE the digests, minus the
          # `sha256:` prefix the build job stripped.
          incoming="$(printf 'sha256:%s\n' * | sort | tr '\n' ' ')"
          echo "incoming: $incoming"

          # `--raw` returns the manifest list itself rather than buildx's
          # rendering of it, so the child digests can be read out directly. A
          # tag that does not exist exits non-zero and leaves this empty.
          published_raw="$(docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" 2>/dev/null || true)"

          if [ -n "$published_raw" ]; then
            # `.manifests` is absent on a single-platform image, in which case
            # this yields an empty string and the comparison below reports a
            # difference — the safe direction, since a single-platform image
            # under this tag is itself something a human should look at.
            published="$(printf '%s' "$published_raw" | node -e '
              let raw = "";
              process.stdin.on("data", (c) => (raw += c));
              process.stdin.on("end", () => {
                try {
                  const index = JSON.parse(raw);
                  const digests = (index.manifests ?? []).map((m) => m.digest).sort();
                  process.stdout.write(digests.length ? digests.join(" ") + " " : "");
                } catch { process.stdout.write(""); }
              });
            ')"
            echo "published: $published"

            if [ "$published" = "$incoming" ]; then
              echo "${IMAGE}:${VERSION} is already published and points at exactly these digests — re-tagging is a no-op."
            elif [ "$OVERWRITE" = "true" ]; then
              echo "::warning::${IMAGE}:${VERSION} is already published with DIFFERENT contents and is being overwritten because overwrite=true was set. Every project pinning this tag will get different code on its next pull."
            else
              echo "::error::${IMAGE}:${VERSION} is already published and this run would change it. Version tags are what every scaffolded docker-compose.yml pins, so overwriting one silently changes code under projects that pinned it. Bump packages/dashboard/package.json and tag the new version, or — if you are deliberately replacing a bad publish — re-run this workflow from the Actions tab with overwrite=true."
              exit 1
            fi
          else
            echo "${IMAGE}:${VERSION} is not published yet."
          fi

          # ── may :latest move onto this version? ──────────────────────────
          #
          # Three conditions, all required. Ref must be a tag (a branch is not a
          # release). Version must be a plain x.y.z (a prerelease is not what
          # `:latest` promises). And it must be the highest version published —
          # equal counts, so the re-run path above still refreshes `:latest`
          # rather than leaving it behind.
          #
          # Use git release tags as a conservative upper bound. A newer tag
          # whose image failed also blocks a rollback of :latest. Failure to
          # fetch tags aborts the gate before any tag is published.
          latest=false
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::warning::ref_type is '${REF_TYPE}', not a tag — publishing ${IMAGE}:${VERSION} but NOT moving :latest. A branch build is not a release."
          elif ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::warning::${VERSION} is not a plain x.y.z version — publishing the tag but not moving :latest onto a prerelease."
          else
            # Git release tags are conservative: a newer tag whose image failed
            # still prevents an older release from taking over :latest. No
            # packages-list API scope is needed. Fail closed on fetch errors.
            tags="$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" | awk '{print $2}' | sed -nE 's#^refs/tags/(@evestack/dashboard@|dashboard-v)([0-9]+\.[0-9]+\.[0-9]+)$#\2#p')"
            if [ -n "$tags" ]; then
              highest="$(printf '%s\n' "$tags" | node -e '
                let raw = "";
                process.stdin.on("data", (c) => (raw += c));
                process.stdin.on("end", () => {
                  // Only plain x.y.z tags are version claims. `latest` itself,
                  // and any prerelease, are excluded: comparing against them is
                  // how a release candidate would win the comparison and pin
                  // `:latest` to something nobody meant to ship.
                  const versions = raw.split("\n")
                    .map((t) => t.trim())
                    .filter((t) => /^[0-9]+\.[0-9]+\.[0-9]+$/.test(t))
                    .map((t) => t.split(".").map(Number));
                  if (versions.length === 0) { process.stdout.write(""); return; }
                  versions.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
                  process.stdout.write(versions.at(-1).join("."));
                });
              ')"

              if [ -z "$highest" ]; then
                echo "no plain x.y.z tag is published yet — ${VERSION} becomes :latest"
                latest=true
              else
                # Numeric field-by-field, in node, because sort -V is not
                # guaranteed and a string compare makes 0.10.0 lose to 0.9.0.
                if node -e '
                  const cmp = (s) => s.split(".").map(Number);
                  const [a, b] = [cmp(process.argv[1]), cmp(process.argv[2])];
                  const ge = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
                  process.exit(ge >= 0 ? 0 : 1);
                ' "$VERSION" "$highest"; then
                  echo "${VERSION} >= highest published (${highest}) — :latest moves"
                  latest=true
                else
                  echo "::warning::${VERSION} is older than the highest published version (${highest}). Publishing ${IMAGE}:${VERSION} but NOT moving :latest, which would otherwise point people at an older release than the one they have."
                fi
              fi
            else
              echo "::warning::No dashboard release tags found; leaving :latest unchanged."
            fi
          fi

          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "move :latest = $latest"

      # Two tags, and the difference matters. The version tag is what every
      # scaffolded docker-compose.yml pins, so it must keep resolving to the
      # image it was tested with — the gate above is what now makes that true
      # rather than merely intended. `latest` is the opt-in for people who would
      # rather track the newest, and it is the only tag that moves, which is why
      # it is conditional: see the gate's second half.
      - name: assemble the multi-arch tag
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MOVE_LATEST: ${{ steps.gate.outputs.latest }}
        run: |
          set -euo pipefail
          # An array, not a string, so that adding a conditional flag does not
          # depend on word splitting to be correct.
          tags=(--tag "${IMAGE}:${VERSION}")
          if [ "$MOVE_LATEST" = "true" ]; then
            tags+=(--tag "${IMAGE}:latest")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: prove it pulls
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.version }}'
          docker buildx imagetools inspect "${IMAGE}:${version}"
          # The claim the whole release makes is "a stranger runs
          # `docker compose --profile dashboard up -d` and it pulls". A logged-in
          # inspect does not test that; only an anonymous one does. The package
          # is PRIVATE by default on first publish and has to be made public once
          # by hand in the package settings — so this step is the thing that
          # notices when that was forgotten, rather than the first user to try.
          docker logout ghcr.io
          if ! docker buildx imagetools inspect "${IMAGE}:${version}" > /dev/null 2>&1; then
            echo "::error::${IMAGE}:${version} is not anonymously pullable. Set the package to Public: https://github.com/users/SammyTourani/packages/container/evestack-dashboard/settings"
            exit 1
          fi
          echo "anonymous pull works"

  # ---------------------------------------------------------------------------
  # release — the GitHub release, written from CHANGELOG.md, only ever on a tag
  # ---------------------------------------------------------------------------
  # Added because this project published twenty-six npm versions and two images
  # with ZERO GitHub releases and one abandoned draft, so the only way to learn
  # what changed between two versions was to read the git log. The notes are not
  # generated from commit subjects: they are lifted verbatim out of CHANGELOG.md,
  # which is written by hand and reviewed, so the release page and the changelog
  # cannot drift into two different accounts of the same version.
  #
  # It cannot publish anything the rest of this workflow has not already
  # published: it needs `merge`, so a failed or unpullable image never gets a
  # release page, and `if: github.ref_type == 'tag'` plus `--verify-tag` mean it
  # only ever attaches to a tag that already exists. A workflow_dispatch on a
  # branch skips it entirely.
  #
  # Which is also why "is there a CHANGELOG section for this version" is NOT
  # decided here any more. That question has to be answered before `merge`
  # pushes the tag, so it is asked in `version` instead; see the comment on that
  # job's "the CHANGELOG section this release publishes from must already exist"
  # step. By the time this job runs, the answer is already known to be yes.
  release:
    needs: [version, merge]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      # The only job here that can write to the repository, and the only thing
      # it writes is a release.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: cut the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          # Whether `merge` actually moved `:latest`. The footer below used to
          # assert it unconditionally, and once `:latest` became conditional
          # that sentence would have been the same class of defect this file
          # already has a paragraph about: a comment in a workflow stating
          # something about another job that is simply not true. The release
          # page is read by people deciding what to pull, so it has to say what
          # happened, not what usually happens.
          MOVED_LATEST: ${{ needs.merge.outputs.latest }}
        run: |
          set -euo pipefail

          # The changelog is grouped by package and every version heading is
          # exactly the tag name for that release, which is what makes this an
          # exact string match rather than a regex over a format that will drift.
          # The heading is keyed on the VERSION rather than on $TAG so that both
          # accepted tag forms resolve to the same section — dashboard-v0.2.0 and
          # @evestack/dashboard@0.2.0 are the same release.
          heading="### @evestack/dashboard@${VERSION}"
          awk -v h="$heading" '
            index($0, h " ") == 1 || $0 == h { found = 1; next }
            # Stop at the next release or package heading. "#### Added" and the
            # other Keep-a-Changelog subheadings are four hashes and are kept.
            found && /^###? / { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"

          # Anti-vacuity, the same rule as the tag scan above: an extractor that
          # silently matched nothing would publish an empty release, and an empty
          # release is worse than no release — it looks like the answer.
          #
          # This is now the BACKSTOP, not the gate. The gate is the identical
          # check in the `version` job ("the CHANGELOG section this release
          # publishes from must already exist"), which runs before `build` and
          # `merge` and therefore before anything reaches GHCR. This copy stays
          # because the two answer different questions: the gate asks whether a
          # section exists, this one asks whether the notes actually extracted
          # here are non-empty — and only the second one can catch an awk that
          # drifted out of step with the gate's.
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/notes.md"; then
            echo "::error::CHANGELOG.md has no '${heading}' section, so there are no notes to publish. The version job's gate should have caught this before the image was pushed — if it did not, the two awk programs have drifted."
            exit 1
          fi

          # The artifact this release is actually about. The notes describe the
          # code; this line is how someone runs it.
          {
            echo
            echo "---"
            echo
            echo "\`\`\`"
            echo "docker pull ${IMAGE}:${VERSION}"
            echo "\`\`\`"
            echo
            if [ "$MOVED_LATEST" = "true" ]; then
              echo "Multi-arch: \`linux/amd64\` and \`linux/arm64\`. Also tagged \`:latest\`."
            else
              echo "Multi-arch: \`linux/amd64\` and \`linux/arm64\`. **\`:latest\` was not moved onto this release** —"
              echo "it still points wherever it did before. Pull the version tag above."
            fi
          } >> "${RUNNER_TEMP}/notes.md"

          # Idempotent, because a re-run of a failed publish must not fail here
          # on "release already exists" after it has done the expensive part.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "dashboard ${VERSION}" \
              --notes-file "${RUNNER_TEMP}/notes.md"
            echo "updated the existing release for $TAG"
          else
            # --verify-tag: gh will CREATE a tag if one does not exist, which is
            # exactly the thing this workflow must never do. Refuse instead.
            gh release create "$TAG" \
              --verify-tag \
              --title "dashboard ${VERSION}" \
              --notes-file "${RUNNER_TEMP}/notes.md"
            echo "created the release for $TAG"
          fi
