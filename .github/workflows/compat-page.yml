name: Compat page

# Regenerates docs-site/compat/index.html from the committed reports in
# contract/history/, proves the committed page still matches them, and hands
# the result out as an artifact.
#
# ── Read this before adding a deploy step ────────────────────────────────────
#
# GitHub Pages is already owned by .github/workflows/deploy-website.yml, which
# static-exports packages/website and publishes packages/website/out via
# actions/deploy-pages to https://sammytourani.github.io/evestack/. A Pages
# deployment replaces the WHOLE site — there is no per-path deploy — so a
# second workflow calling deploy-pages with only the compat page would take the
# landing page down. That is why this workflow does not call it.
#
# What a human must wire up to serve the page at /evestack/compat/ — one of:
#
#   A. Preferred, no new deployment. Next copies packages/website/public/**
#      verbatim into out/, so the compat page only has to land there before the
#      site builds. In deploy-website.yml, add to the `paths:` filter:
#
#            - "contract/history/**"
#            - "contract/render-compat.mjs"
#
#      and add one step before `pnpm --filter @evestack/website build`:
#
#            - run: node contract/render-compat.mjs --out=packages/website/public/compat/index.html
#
#      The site then ships /compat as a sub-path of its own artifact and the two
#      workflows never contend.
#
#   B. Commit the rendered file to packages/website/public/compat/index.html and
#      let the existing path filter carry it. Simpler, but the page goes stale
#      the moment someone records a report and forgets to re-render.
#
#   C. Download this workflow's `compat-page` artifact and publish it wherever
#      else you like. It is a single self-contained HTML file with no external
#      CSS, JS, fonts or images.
#
# Whichever is chosen, the page's own links assume it is served from a directory
# (…/compat/), not from the site root.

on:
  push:
    branches: [main]
    # The page is a pure function of these three things. Nothing else can
    # change it, so nothing else should trigger a rebuild.
    paths:
      - "contract/history/**"
      - "contract/render-compat.mjs"
      - ".github/workflows/compat-page.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here — the action reads packageManager from package.json,
      # and specifying both makes it refuse to install (see ci.yml).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # No `pnpm install`: the renderer reads JSON with the Node standard
      # library and nothing else. Recording a NEW version does need an install
      # (see contract/history/README.md), but that is a local, deliberate act —
      # this job only re-renders what is already committed.
      - name: regenerate the page from contract/history/
        run: node contract/render-compat.mjs

      # The committed HTML is the artifact humans link to, so it has to be
      # provably the render of the committed JSON. The renderer is deterministic
      # — no clock, no locale, no network — so any diff here means either the
      # page was hand-edited or someone recorded a report without re-rendering.
      - name: the committed page matches the committed reports
        run: |
          # `git status --porcelain`, not `git diff`: a page that was never
          # committed at all is just as stale as a modified one, and git diff
          # is blind to untracked files.
          if [ -n "$(git status --porcelain -- docs-site/compat/index.html)" ]; then
            echo "::error file=docs-site/compat/index.html::Out of date. Run 'node contract/render-compat.mjs' and commit the result."
            git status --short -- docs-site/compat/index.html
            git diff -- docs-site/compat/index.html | head -80
            exit 1
          fi

      # An empty or truncated matrix still renders as perfectly valid HTML, and
      # the diff above would happily certify it. So assert the shape: every
      # recorded version has a column, and the grid is fully populated.
      - name: the page actually contains a matrix
        run: |
          node -e '
            const fs = require("node:fs");
            const html = fs.readFileSync("docs-site/compat/index.html", "utf8");
            const files = fs.readdirSync("contract/history").filter((f) => f.endsWith(".json"));
            if (files.length === 0) throw new Error("contract/history/ has no reports");
            const reports = files.map((f) => JSON.parse(fs.readFileSync(`contract/history/${f}`, "utf8")));

            // The column header specifically, not just the version string
            // anywhere: the version also appears in the provenance table and in
            // the failure write-ups, so a looser check passes on a page whose
            // matrix lost the column entirely.
            for (const r of reports) {
              if (!html.includes(`<span class="v">${r.eveVersion}</span>`)) {
                throw new Error(`eve ${r.eveVersion} is recorded but has no column in the matrix`);
              }
            }

            // One row per contract seen in any report, plus the overall row,
            // times one column per version. Versions missing a contract still
            // get a placeholder cell, so the grid is always exactly this size.
            const ids = new Set(reports.flatMap((r) => r.contracts.map((c) => c.id)));
            const expected = (ids.size + 1) * reports.length;
            const cells = (html.match(/<td class="s /g) || []).length;
            if (cells !== expected) throw new Error(`matrix has ${cells} cells, expected ${expected}`);
            console.log(`${reports.length} versions x ${ids.size} contracts = ${cells} cells`);
          '

      - uses: actions/upload-artifact@v4
        with:
          name: compat-page
          path: docs-site/compat/index.html
          if-no-files-found: error
