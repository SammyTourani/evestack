name: Evals

# The only job in this repository that spends money, and the only one whose
# result depends on what a language model chose to say.
#
# ── Why it is not part of CI ─────────────────────────────────────────────────
#
# `eve eval` drives a real model through a real Docker sandbox. On
# `pull_request` that means any fork — including a hostile one — can spend the
# repository owner's provider budget by opening a PR, which is why ci.yml
# deliberately does not run it. `schedule` and `workflow_dispatch` run only on
# the default branch, are unreachable by fork PRs, and receive secrets.
#
# ── Why it is not a gate ─────────────────────────────────────────────────────
#
# These evals are nondeterministic. deny-survives is documented at roughly three
# passes in four on gpt-5-mini, and its failure mode is usually *vacuous*: the
# model answers in prose, never calls the gated tool, and the test never reaches
# its subject. A gate that is wrong one run in four gets muted within a week,
# and a muted gate is worse than an absent one — so this reports, and a human
# reads it.
#
# What makes the report worth reading is the negative control below.

on:
  schedule:
    # Nightly, well after eve-watch, so a red eval can be read against a known
    # eve version rather than racing an upgrade.
    - cron: "43 7 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "EVESTACK_MODEL to run against (default: the template's own default)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    outputs:
      report: ${{ steps.prepare-report.outputs.ready }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: evestack
          POSTGRES_PASSWORD: evestack
          POSTGRES_DB: evestack
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U evestack -d evestack"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    # Only the live eval steps receive the provider key. Installation and the
    # negative-control copy use the frozen workspace without provider secrets;
    # publishing the report runs in a separate job with no project execution.
    env:
      WORKFLOW_POSTGRES_URL: postgres://evestack:evestack@localhost:5433/evestack
      EVESTACK_MODEL: ${{ inputs.model }}
      TZ: America/New_York
    steps:
      # SHA-pinned and de-credentialed for the reasons ci.yml's first checkout
      # spells out. The credential half matters here for the same reason the key
      # scoping above does: this job installs and runs third-party code, so
      # a token sitting in `.git/config` is a token every postinstall script in
      # that tree can read.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      # This step exists only because the `secrets` context is NOT available in
      # a step's `if:` — `if: secrets.OPENAI_API_KEY != ''` does not evaluate
      # there, it is simply not one of the contexts that expression can see. So
      # the presence test has to happen inside a `run:`, which means one step
      # does get the secret in its environment purely to ask whether it is
      # empty. That step runs `[ -n ... ]` and nothing else: no install, no
      # third-party code, no network.
      - name: is a provider key configured?
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no OPENAI_API_KEY secret — evals skipped. This job checks nothing without it."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.key.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.key.outputs.enabled == 'true'
        run: pnpm -r --if-present run build

      - name: bootstrap the workflow schema
        if: steps.key.outputs.enabled == 'true'
        run: cd templates/default && npm run db:bootstrap

      # ─────────────────────────────────────────────────────────────────────────
      # The negative control, FIRST.
      #
      # Running it before the real suite is deliberate. If the deny gate cannot
      # fail, then whatever the real suite reports afterwards means nothing, and
      # finding that out first stops a green run from being published as
      # evidence. This repository has shipped a QA check that asserted nothing
      # before; the contract suite is pointed at eve 0.29.5 for exactly this
      # reason.
      # ─────────────────────────────────────────────────────────────────────────
      - name: prepare negative control from the frozen install
        if: steps.key.outputs.enabled == 'true'
        run: |
          BROKEN="$(node contract/runtime/negative-control.mjs templates/negative-control)"
          # The sibling has the same depth as templates/default, so copied
          # relative workspace links still resolve to the frozen root install.
          # No installer runs in this copy, before or after the model key exists.
          cp -a templates/default/node_modules "$BROKEN/node_modules"

      - name: the deny gate must fail against a build with the fix removed
        if: steps.key.outputs.enabled == 'true'
        # The key is scoped to this step rather than to the job — see the note
        # on the job's `env:` block. This step genuinely needs it: `eve eval`
        # drives a real model, and a negative control that cannot reach the
        # provider proves nothing.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd templates/negative-control
          npx eve dev --port 2998 > /tmp/nc-agent.log 2>&1 &
          echo $! > /tmp/nc.pid
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:2998/ 2>/dev/null && break
            sleep 1
          done

          curl -sf -o /dev/null http://localhost:2998/ || { echo 'Negative-control server did not become ready'; exit 1; }
          set +e
          npx --no-install eve eval deny-survives --json --url http://127.0.0.1:2998/ > /tmp/nc-eval.json 2> /tmp/nc-eval.log
          RESULT=$?
          set -e
          kill "$(cat /tmp/nc.pid)" 2>/dev/null || true

          cat /tmp/nc-eval.log
          node ../../.github/scripts/check-negative-control.mjs /tmp/nc-eval.json "$RESULT"

      - name: the real suite
        if: steps.key.outputs.enabled == 'true'
        id: suite
        continue-on-error: true
        # Same as the negative control above: scoped here because this is one of
        # the two steps whose whole job is to talk to the provider.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd templates/default
          npx eve dev --port 2997 > /tmp/agent.log 2>&1 &
          echo $! > /tmp/agent.pid
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:2997/ 2>/dev/null && break
            sleep 1
          done

          set +e
          npx eve eval --url http://127.0.0.1:2997/ 2>&1 | tee /tmp/evals.log
          echo "result=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e
          kill "$(cat /tmp/agent.pid)" 2>/dev/null || true

      - name: prepare report
        id: prepare-report
        if: steps.key.outputs.enabled == 'true' && steps.suite.outputs.result != '0'
        run: |
          # An issue rather than a failed job, because a nondeterministic result
          # must not gate a merge. But WHICH KIND of failure it was is a
          # mechanical question, and this step used to leave it to the reader.
          #
          # That is how a nightly becomes noise. `deny-survives` is vacuous
          # roughly one run in four on gpt-5-mini, so the issue was updated most
          # mornings with prose that opened "check which kind of failure it is"
          # — identical text whether the model had simply answered without
          # calling the gated tool, or the deny path had genuinely regressed.
          # After a week of that, the one morning it mattered would have read
          # exactly like the six that did not. `provider-bisect.yml` already
          # classifies its arms this way; this is the same rule, applied where
          # it is read every day.
          #
          # VACUOUS is the narrow case and is recognised narrowly: the run
          # parked on nothing, and NOTHING failed at the session or turn level.
          # Anything with session.failed or turn.failed is REAL — that is the
          # deny-path family. Anything else is UNCLEAR and says so rather than
          # guessing, because a wrong confident label is worse than none.
          if grep -qE 'session\.failed|turn\.failed' /tmp/evals.log; then
            KIND="REAL"
            LEDE="A gate failed at the session or turn level. That is the deny-path family, not the known vacuous flake — **this one is worth reading today.**"
          elif grep -qE 'parked \(0%|no pending requests' /tmp/evals.log; then
            KIND="vacuous"
            LEDE="The run never reached its subject: the model answered in prose and never called the gated tool. This is the documented flake, roughly one run in four on gpt-5-mini. Re-run, or dispatch with \`model: gpt-5\`."
          else
            KIND="unclear"
            LEDE="The failure matches neither the vacuous signature nor the deny-path family. Read the log below — this classifier has not seen this shape before, which is itself worth knowing."
          fi

          {
            echo "**Classified: ${KIND}.** ${LEDE}"
            echo
            echo "The negative control passed, so the deny gate is still capable of detecting the"
            echo "bug — this is a real result, not a broken harness."
            echo
            echo "The two kinds, for reference:"
            echo
            echo "- **Vacuous** — \`parked (0%): it ended \"waiting\" with no pending requests\`."
            echo "  The model answered in prose and never called the gated tool, so the test never"
            echo "  reached its subject. Documented at roughly one run in four on gpt-5-mini."
            echo "  Re-run, or dispatch this workflow with \`model: gpt-5\`."
            echo "- **Real** — a failure on \`session.failed\` or \`turn.failed\`. That is the"
            echo "  deny-path bug, or something new in the same family."
            echo
            echo '```'
            tail -c 40000 /tmp/evals.log
            echo '```'
          } > /tmp/issue.md

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.prepare-report.outputs.ready == 'true'
        with:
          name: eval-report
          path: /tmp/issue.md
          retention-days: 7

      - name: logs
        if: always() && steps.key.outputs.enabled == 'true'
        run: |
          echo "── agent ───────────────────────────────────────────────────"
          tail -c 20000 /tmp/agent.log 2>/dev/null || echo "(none)"
          echo "── negative-control agent ──────────────────────────────────"
          tail -c 20000 /tmp/nc-agent.log 2>/dev/null || echo "(none)"

  report:
    needs: evals
    if: always() && needs.evals.outputs.report == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      # No checkout or dependency execution in the job holding the write token.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: eval-report
          path: report
      - name: file the report as data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --label eval-run --json number --jq '.[0].number // empty')"
          gh label create eval-run --color B60205 --description "Nightly eval run needs a look" 2>/dev/null || true
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report/issue.md
          else
            gh issue create --title "Nightly evals require investigation" --body-file report/issue.md --label eval-run
          fi
